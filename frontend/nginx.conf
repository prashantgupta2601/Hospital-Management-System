# ─────────────────────────────────────────────────────────────
# PG CARE HMS — Nginx Reverse Proxy Configuration (Step 4 Verification)
#
# Responsibilities:
#   - Serve the static frontend (HTML/CSS/JS)
#   - Proxy /api/* requests to the Spring Boot backend
#   - Proxy /ws/* WebSocket connections to the backend
#   - Enable gzip compression for performance
#   - Security headers for production hardening
# ─────────────────────────────────────────────────────────────

# ── Gzip Compression ──────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # ── Static Frontend ────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health Check Endpoint ─────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── API Reverse Proxy ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffer_size        4k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;
    }

    # ── WebSocket Proxy ───────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;   # keep WebSocket alive
    }

    # ── Actuator Health (internal monitoring) ─────────────────
    location /actuator/health {
        proxy_pass http://backend:8081/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-XSS-Protection         "1; mode=block"    always;
    add_header Referrer-Policy          "strict-origin"    always;
    add_header Permissions-Policy       "geolocation=()"   always;

    # ── Error Pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
