<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS Portal – Vintage Luxury Login</title>
    <meta name="description" content="Secure premium portal for Hospital Management System staff and patients.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/ux-polish.css">
    <link rel="stylesheet" href="css/login-luxury.css">
</head>
<body>

<!-- Vignette framing the screen -->
<div class="vignette"></div>

<!-- Drifting gold particles & trail canvas -->
<canvas id="particle-canvas"></canvas>

<!-- Parallax atmospheric layers -->
<div class="atmospheric-container">
    <div class="ambient-orb orb-gold" id="orb-gold"></div>
    <div class="ambient-orb orb-blue" id="orb-blue"></div>
    <div class="parallax-hospital" id="para-hospital" style="background-image: url('assets/luxury_hospital.png');"></div>
    <div class="parallax-pattern-glow" id="para-pattern-glow"></div>
    <div class="parallax-pattern" id="para-pattern"></div>
    <div class="light-streak"></div>
</div>

<!-- Main branding outside the card for premium spacious layout -->
<div class="brand">
    <div class="brand-icon"><i class="bi bi-hospital"></i></div>
    <h1>HMS Portal</h1>
    <p>Hospital Management System</p>
</div>

<!-- Card Wrapper for glowing border -->
<div class="login-container">
    <div class="card-border-wrapper">
        <div class="card">
            <!-- Ornamental corners -->
            <div class="card-corner corner-tl"></div>
            <div class="card-corner corner-tr"></div>
            <div class="card-corner corner-bl"></div>
            <div class="card-corner corner-br"></div>

            <!-- Tabs -->
            <div class="tabs">
                <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
                <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Alert Box -->
            <div id="alertBox" class="alert"></div>

            <!-- ── Sign In Panel ── -->
            <div id="loginPanel" class="panel active">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <div class="input-wrap">
                            <i class="bi bi-person"></i>
                            <input id="loginUsername" type="text" placeholder="Enter your username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock"></i>
                            <input id="loginPassword" type="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-pw" onclick="togglePw('loginPassword', this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button id="loginBtn" type="submit" class="btn-submit">
                        <div id="loginSpinner" class="spinner"></div>
                        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right"></i> Sign In</span>
                    </button>
                </form>
            </div>

            <!-- ── Register Panel ── -->
            <div id="registerPanel" class="panel">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <div class="input-wrap">
                            <i class="bi bi-person"></i>
                            <input id="regUsername" type="text" placeholder="Choose a username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <div class="input-wrap">
                            <i class="bi bi-envelope"></i>
                            <input id="regEmail" type="email" placeholder="your@email.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock"></i>
                            <input id="regPassword" type="password" placeholder="Min. 6 characters" required autocomplete="new-password">
                            <button type="button" class="toggle-pw" onclick="togglePw('regPassword', this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regRole">Role</label>
                        <div class="input-wrap">
                            <i class="bi bi-shield-check"></i>
                            <select id="regRole">
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <button id="regBtn" type="submit" class="btn-submit">
                        <div id="regSpinner" class="spinner"></div>
                        <span id="regBtnText"><i class="bi bi-person-plus"></i> Create Account</span>
                    </button>
                </form>
            </div>

            <div class="card-footer">
                &copy; 2026 HMS Portal &mdash; Vintage Luxury Healthcare
            </div>
        </div>
    </div>
</div>

<!-- Bottom Section: Divider & Key Features -->
<div class="bottom-section">
    <div class="divider-container">
        <div class="divider-line"></div>
        <div class="divider-center"></div>
        <div class="divider-line"></div>
    </div>
    <div class="features-row">
        <div class="feature-badge">
            <div class="feature-icon-circle"><i class="bi bi-shield-lock"></i></div>
            <div class="feature-title">Secure & Compliant</div>
            <div class="feature-sub">Premium grade encryption</div>
        </div>
        <div class="feature-badge">
            <div class="feature-icon-circle"><i class="bi bi-activity"></i></div>
            <div class="feature-title">Efficient Workflow</div>
            <div class="feature-sub">Optimized practitioner tools</div>
        </div>
        <div class="feature-badge">
            <div class="feature-icon-circle"><i class="bi bi-bar-chart-line"></i></div>
            <div class="feature-title">Smart Analytics</div>
            <div class="feature-sub">Deep predictive insights</div>
        </div>
        <div class="feature-badge">
            <div class="feature-icon-circle"><i class="bi bi-heart-pulse"></i></div>
            <div class="feature-title">Patient Centric</div>
            <div class="feature-sub">Care-oriented technology</div>
        </div>
    </div>
</div>

<!-- JS imports -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="services/api.js"></script>
<script src="js/ux.js"></script>
<script>
    // Redirect if already logged in
    if (AuthService.isLoggedIn()) {
        window.location.href = 'index.html';
    }

    // Modern Entrance Animations with GSAP
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof gsap !== 'undefined') {
            gsap.fromTo('.brand', { y: -45, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out' });
            gsap.fromTo('.login-container', { y: 45, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out', delay: 0.18 });
            gsap.fromTo('.bottom-section', { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power2.out', delay: 0.4 });
        }

        // Process session expiry and inactivity notifications
        const params = new URLSearchParams(window.location.search);
        const reason = params.get('reason');
        if (reason === 'expired') {
            showAlert('Your session has expired. Please sign in again.', 'error');
        } else if (reason === 'inactive') {
            showAlert('Logged out due to 5 minutes of inactivity.', 'error');
        }
    });

    // ── HIGH PERFORMANCE CANVAS DRIFTING GOLD PARTICLES & RESPONSIVE CURSOR TRAIL ──
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const trail = [];

    class GoldParticle {
        constructor() {
            this.reset();
            this.y = Math.random() * height; // Distribute on startup
        }
        
        reset() {
            this.x = Math.random() * width;
            this.y = height + 12;
            this.size = Math.random() * 1.8 + 0.6;
            this.speedY = Math.random() * 0.35 + 0.12;
            this.speedX = Math.random() * 0.16 - 0.08;
            this.alpha = Math.random() * 0.5 + 0.2;
            this.angle = Math.random() * Math.PI * 2;
            this.waveSpeed = Math.random() * 0.015 + 0.005;
        }
        
        update() {
            this.y -= this.speedY;
            this.angle += this.waveSpeed;
            this.x += Math.sin(this.angle) * 0.22 + this.speedX;
            
            if (this.y < -12 || this.x < -12 || this.x > width + 12) {
                this.reset();
            }
        }
        
        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
            ctx.shadowBlur = this.size * 3.5;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.8)';
            ctx.fill();
            ctx.restore();
        }
    }

    class TrailParticle {
        constructor(x, y) {
            this.x = x + (Math.random() * 6 - 3);
            this.y = y + (Math.random() * 6 - 3);
            this.size = Math.random() * 2.8 + 1.0;
            this.alpha = 1.0;
            this.decay = Math.random() * 0.026 + 0.016;
            this.speedX = Math.random() * 0.7 - 0.35;
            this.speedY = Math.random() * 0.7 - 0.35;
        }
        
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.alpha -= this.decay;
        }
        
        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(243, 229, 171, ${this.alpha})`;
            ctx.shadowBlur = this.size * 4;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.9)';
            ctx.fill();
            ctx.restore();
        }
    }

    // Initialize 65 ambient particles
    for (let i = 0; i < 65; i++) {
        particles.push(new GoldParticle());
    }

    // Mouse coordinates tracker for Trail & Interactive Parallax
    let mouseX = width / 2;
    let mouseY = height / 2;
    let lastMouseX = mouseX;
    let lastMouseY = mouseY;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        // Parallax Movement Calculations
        const xOffset = (width / 2 - mouseX) / 28;
        const yOffset = (height / 2 - mouseY) / 28;
        
        const paraHospital = document.getElementById('para-hospital');
        const paraPattern = document.getElementById('para-pattern');
        const paraPatternGlow = document.getElementById('para-pattern-glow');
        const orbGold = document.getElementById('orb-gold');
        const orbBlue = document.getElementById('orb-blue');
        
        if (paraHospital) paraHospital.style.transform = `translate3d(${xOffset * 0.45}px, ${yOffset * 0.45}px, 0)`;
        if (paraPattern) paraPattern.style.transform = `translate3d(${xOffset * -0.6}px, ${yOffset * -0.6}px, 0)`;
        if (paraPatternGlow) paraPatternGlow.style.transform = `translate3d(${xOffset * -0.35}px, ${yOffset * -0.35}px, 0)`;
        if (orbGold) orbGold.style.transform = `translate3d(${xOffset * 0.25}px, ${yOffset * 0.25}px, 0)`;
        if (orbBlue) orbBlue.style.transform = `translate3d(${xOffset * -0.25}px, ${yOffset * -0.25}px, 0)`;

        // Cursor Trail generation
        const dist = Math.hypot(mouseX - lastMouseX, mouseY - lastMouseY);
        if (dist > 3) {
            for (let i = 0; i < 2; i++) {
                trail.push(new TrailParticle(mouseX, mouseY));
            }
            lastMouseX = mouseX;
            lastMouseY = mouseY;
        }
    });

    // Unified Animation loop
    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Drifting gold dots
        for (let p of particles) {
            p.update();
            p.draw();
        }
        
        // Interactive cursor trail sparks
        for (let i = trail.length - 1; i >= 0; i--) {
            const t = trail[i];
            t.update();
            if (t.alpha <= 0) {
                trail.splice(i, 1);
            } else {
                t.draw();
            }
        }
        
        requestAnimationFrame(animate);
    }
    animate();


    // ── ACTIVE HANDLERS & API UTILITIES ──
    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('loginPanel').classList.toggle('active', isLogin);
        document.getElementById('registerPanel').classList.toggle('active', !isLogin);
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabRegister').classList.toggle('active', !isLogin);
        hideAlert();
    }

    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alertBox');
        box.className = `alert alert-${type} show`;
        box.innerHTML = `<i class="bi bi-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
    }
    
    function hideAlert() {
        document.getElementById('alertBox').className = 'alert';
    }

    function setLoading(btnId, spinnerId, textId, loading) {
        document.getElementById(btnId).disabled = loading;
        document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
        document.getElementById(textId).style.display   = loading ? 'none'  : 'flex';
    }

    function togglePw(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        setLoading('loginBtn', 'loginSpinner', 'loginBtnText', true);
        try {
            await AuthService.login(username, password);
            showAlert('Login successful! Redirecting…', 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 800);
        } catch (err) {
            showAlert(err.message || 'Invalid username or password.');
        } finally {
            setLoading('loginBtn', 'loginSpinner', 'loginBtnText', false);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById('regUsername').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const role     = document.getElementById('regRole').value;
        setLoading('regBtn', 'regSpinner', 'regBtnText', true);
        try {
            await AuthService.register(username, email, password, [role]);
            showAlert('Account created! You can now sign in.', 'success');
            setTimeout(() => switchTab('login'), 1200);
        } catch (err) {
            showAlert(err.message || 'Registration failed. Please try again.');
        } finally {
            setLoading('regBtn', 'regSpinner', 'regBtnText', false);
        }
    }
</script>
</body>
</html>
